version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<docker-service-name>_1
      APP_HOST: misto-snapprint_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/misto87/snapprint:sha-ca6b7b4@sha256:1443ce7cf8d0fc7a0af74d0d33b877573b707399073a5e658f5ec07e2ecd0391
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      SNAPPRINT_DATA_DIR: /data
      SNAPPRINT_PRINTER_HOST: "192.168.178.43"
      SNAPPRINT_PRINTER_PORT: "7125"
    volumes:
      - ${APP_DATA_DIR}/data:/data
