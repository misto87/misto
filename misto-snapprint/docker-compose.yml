version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<docker-service-name>_1
      APP_HOST: misto-snapprint_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/misto87/snapprint:sha-4b6681e@sha256:957bed3f717008d4880a013291203ad59fd82e8cf67927262a86b94ecc126580
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      SNAPPRINT_DATA_DIR: /data
      SNAPPRINT_PRINTER_HOST: "192.168.178.43"
      SNAPPRINT_PRINTER_PORT: "7125"
    volumes:
      - ${APP_DATA_DIR}/data:/data
